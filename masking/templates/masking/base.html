{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fa">
  <title>{% block title %}PDPA Masking — ปิดบังข้อมูลส่วนบุคคล{% endblock %}</title>
  <meta name="description" content="เครื่องมือสาธิตการปิดบังข้อมูลส่วนบุคคลในข้อความด้วย Regular Expression">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="{% static 'masking/js/app.js' %}" defer></script>
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <script src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js" defer></script>
  <link rel="stylesheet" href="{% static 'masking/css/app.css' %}">
  {% block head %}{% endblock %}
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <!--
  THESIS: Privacy masking is a clear before-and-after inspection, never a theatrical cyber dashboard.
  OWN-WORLD: Cool white work surfaces, navy type, teal action, fine rules, and five restrained category colors.
  STORY: Choose rules, paste a log, inspect protected output, then copy it with confidence.
  FIRST VIEWPORT: Slim product bar above a rule rail and two equal editors joined by a transformation bridge; primary action sits above the output.
  FORM: Clean compliance workspace, delegated user choice; seed key 85362bf8.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
  -->
  <header class="site-header">
    <a class="brand" href="{% url 'masking:index' %}" aria-label="PDPA Masking หน้าหลัก">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2.75 19 5.8v5.48c0 4.38-2.93 8.42-7 9.97-4.07-1.55-7-5.59-7-9.97V5.8L12 2.75Z"/><path d="M9.4 11.25v-1a2.6 2.6 0 1 1 5.2 0v1M8.7 11.25h6.6v5H8.7v-5Z"/></svg></span>
      <span class="brand-name">PDPA MASKING</span>
    </a>
    <nav class="header-actions" aria-label="ลิงก์โครงการ">
      {% if github_url %}
        <a class="github-link" href="{{ github_url }}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 19c-4.5 1.4-4.5-2.5-6.3-3m12.6 5v-3.5c0-1 .1-1.5-.5-2.1 2.7-.3 5.5-1.3 5.5-6A4.7 4.7 0 0 0 19 6.1c.1-.3.6-1.6-.1-3.1 0 0-1.1-.3-3.6 1.3a12.4 12.4 0 0 0-6.6 0C6.2 2.7 5.1 3 5.1 3 4.4 4.5 4.9 5.8 5 6.1a4.7 4.7 0 0 0-1.3 3.3c0 4.7 2.8 5.7 5.5 6-.6.6-.6 1.2-.5 2.1V21"/></svg>GitHub</a>
      {% endif %}
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
