services:
  web:
    build:
      context: .
      target: dev
    container_name: pdpa-web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    stdin_open: true
    tty: true

  test:
    build:
      context: .
      target: dev
    profiles: ["tools"]
    command: pytest -ra
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
