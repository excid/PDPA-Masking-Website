services:
  web:
    build:
      context: .
      target: dev
    container_name: pdpa-web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      # bind mount ให้แก้โค้ดแล้ว reload ทันที ไม่ต้อง rebuild
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      # required: false = ถ้ายังไม่ได้ cp .env.example .env ก็ยังรันได้ (ใช้ค่า default)
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    stdin_open: true
    tty: true

  # service สำหรับรัน test: docker compose run --rm test
  test:
    build:
      context: .
      target: dev
    profiles: ["tools"]
    command: pytest -ra
    volumes:
      - .:/app
    env_file:
      # required: false = ถ้ายังไม่ได้ cp .env.example .env ก็ยังรันได้ (ใช้ค่า default)
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
